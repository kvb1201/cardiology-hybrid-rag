# retrieval.yaml
# ──────────────
# Centralised configuration for all retrieval experiments.
#
# IMPORTANT: do not tune these values based on retrieval results until
# a frozen evaluation set (qrels) is in place.  Record any parameter
# changes as a new named experiment rather than editing defaults.
#
# Stage implemented: 2A (BM25) + 2C (LSH) + 2D (Dense) + 2E (Hybrid RRF)

# ── Corpus ────────────────────────────────────────────────────────────────
corpus:
  chunks_path: "data/chunks/chunks.jsonl"
  n_chunks: 1142                    # frozen Corpus V1
  chunk_size_tokens: 256
  overlap_tokens: 32
  strategy: "sentence"

# ── BM25 (Stage 2A baseline — do not tune) ───────────────────────────────
bm25:
  k1: 1.5                           # term-frequency saturation
  b: 0.75                           # document-length normalisation
  index_path: "indexes/bm25"
  index_filename: "bm25_index.pkl"
  # tokenizer: lowercase + alphanumeric+hyphen filter; no stemming

# ── LSH / MinHash (Stage 2C baseline — do not tune) ───────────────────────
lsh:
  shingle_size: 3                   # word k-gram size (word 3-grams)
  num_perm: 128                     # MinHash permutations (accuracy vs speed)
  threshold: 0.3                    # approximate Jaccard threshold for candidates
  index_path: "indexes/lsh"
  index_filename: "lsh_index.pkl"
  # Shingling: lowercase + alphanumeric-hyphen tokens (same as BM25 tokenizer)
  # Score: exact Jaccard similarity over shingle sets (NOT comparable to BM25 scores)
  # Note: threshold=0.3 is initial baseline. Lower = more candidates. Do not tune.

# ── Dense / FAISS (Stage 2D baseline — do not tune) ───────────────────────
dense:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  model_version: "as-downloaded via sentence-transformers 3.4.1"
  embedding_dim: 384
  normalize_embeddings: true        # L2-normalise → inner product = cosine
  similarity_metric: "inner_product (cosine on unit vectors)"
  faiss_index_type: "IndexFlatIP"   # exact search — deterministic, no approximation
  batch_size: 64
  index_path: "indexes/faiss"
  index_filename: "dense_index.faiss"
  # Note: all-MiniLM-L6-v2 chosen for competitive quality, small size (90 MB),
  # and reproducibility. No fine-tuning applied. Zero-shot baseline.

# ── Hybrid RRF (Stage 2E — implemented) ──────────────────────────────────
hybrid:
  method: rrf
  rrf_k: 60                         # FIXED — do not tune on qrels (Cormack et al. 2009)
  candidate_depth: 20               # candidates each retriever contributes per query
  # Systems evaluated:
  #   system_a: BM25 + Dense
  #   system_b: BM25 + Dense + LSH
  # rrf_k=60 is frozen before evaluation. Parameter changes require a new experiment name.

# ── Retrieval top-k values used in evaluation ────────────────────────────
evaluation:
  top_k_values: [5, 10, 20]
  default_top_k: 10
  relevance_levels:
    not_relevant: 0
    partially_relevant: 1
    highly_relevant: 2
